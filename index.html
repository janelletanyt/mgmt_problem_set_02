    <script>
      // Prevent cross-origin third-party script errors (e.g., Disqus embeds/trackers in iframes) from crashing the app
      window.addEventListener(
        'error',
        function (event) {
          if (
            event.message === 'Script error.' ||
            !event.filename ||
            (typeof event.filename === 'string' &&
              (event.filename.indexOf('disqus') !== -1 ||
                event.filename.indexOf('disquscdn') !== -1 ||
                event.filename.indexOf('liadm') !== -1 ||
                event.filename.indexOf('rezync') !== -1))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        },
        true
      );
      var _origOnError = window.onerror;
      window.onerror = function (message, source, lineno, colno, error) {
        if (
          message === 'Script error.' ||
          !source ||
          (typeof source === 'string' &&
            (source.indexOf('disqus') !== -1 ||
              source.indexOf('disquscdn') !== -1 ||
              source.indexOf('liadm') !== -1 ||
              source.indexOf('rezync') !== -1))
        ) {
          return true;
        }
        if (typeof _origOnError === 'function') {
          return _origOnError.apply(this, arguments);
        }
      };
      window.addEventListener(
        'unhandledrejection',
        function (event) {
          var reason = event.reason;
          if (
            !reason ||
            (typeof reason === 'string' && reason.indexOf('disqus') !== -1) ||
            (reason &&
              reason.message &&
              (reason.message === 'Script error.' || reason.message.indexOf('disqus') !== -1))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        },
        true
      );
    </script>
